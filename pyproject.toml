[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "truncfold"
version = "1.0.0"
description = "Structure-guided prioritization of systematic N- and C-terminal protein truncations"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = [
  "biopython>=1.83,<2",
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "scipy>=1.11,<2",
]

[project.scripts]
truncfold = "truncfold.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
